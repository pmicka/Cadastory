name: Scout 3DEP discovery

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.event.issue.title == '[ops] Inspect Scout 3DEP coverage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current USGS WESM metadata
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin >/dev/null
          curl -fsSL -A 'Scout-Cadastory-3DEP-Discovery/1.1' \
            'https://rockyweb.usgs.gov/vdelivery/Datasets/Staged/Elevation/metadata/WESM.gpkg' \
            -o /tmp/WESM.gpkg
          echo 'WESM_GPKG_SIZE_BYTES='$(stat -c%s /tmp/WESM.gpkg)
          ogrinfo -ro -so /tmp/WESM.gpkg
          for layer in $(ogrinfo -ro -so /tmp/WESM.gpkg 2>/dev/null | sed -n 's/^[0-9][0-9]*: \([^ ]*\).*/\1/p'); do
            echo "WESM_LAYER=$layer"
            ogrinfo -ro -so /tmp/WESM.gpkg "$layer" | sed -n '1,120p'
          done
