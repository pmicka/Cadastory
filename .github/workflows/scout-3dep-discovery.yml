name: Scout 3DEP discovery

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.event.issue.title == '[ops] Inspect Scout 3DEP coverage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current USGS WESM metadata
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request
          url='https://rockyweb.usgs.gov/vdelivery/Datasets/Staged/Elevation/metadata/WESM.csv'
          req=urllib.request.Request(url, headers={'User-Agent':'Scout-Cadastory-3DEP-Discovery/1.0'})
          with urllib.request.urlopen(req, timeout=120) as r:
              raw=r.read().decode('utf-8-sig', errors='replace')
          reader=csv.DictReader(io.StringIO(raw))
          print('WESM_COLUMNS=' + json.dumps(reader.fieldnames))
          for i,row in enumerate(reader):
              if i >= 5:
                  break
              print('WESM_SAMPLE=' + json.dumps(row, sort_keys=True))
          PY
