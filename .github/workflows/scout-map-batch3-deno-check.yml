name: Scout map Batch 3 Deno check

on:
  push:
    branches:
      - scout-pnc-map-integration-batch3-20260912

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout-pnc-map-integration-batch3-20260912
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deno check Scout sandbox
        run: deno check supabase/functions/scout-component-sandbox-mcp/index.ts
      - name: Deno check Scout connect gateway
        run: deno check supabase/functions/scout-connect/index.ts
      - name: Deno check Scout contract gateway
        run: deno check supabase/functions/scout-mcp-contract/index.ts
      - name: Install exact UI dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Audit production UI dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm audit --omit=dev --audit-level=critical
      - name: Rebuild and test exact UI state
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run build && npm test
