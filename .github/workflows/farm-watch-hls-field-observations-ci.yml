name: Farm Watch HLS field observations CI

on:
  pull_request:
    paths:
      - 'docs/FARM_WATCH_FIELD_PHENOLOGY_V1.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_IMPLEMENTATION_PLAN.md'
      - 'supabase/migrations/*farm_watch_hls_field_materializer*.sql'
      - 'supabase/functions/_shared/farm-watch-hls-field-observation-contract.ts'
      - 'supabase/functions/_shared/farm-watch-hls-field-observation-contract.test.ts'
      - 'supabase/functions/_shared/github-actions-oidc.ts'
      - 'supabase/functions/farm-watch-field-phenology-worker/**'
      - 'scripts/farm-watch-hls-field-observations.py'
      - 'scripts/check-farm-watch-hls-field-materializer-migration.ts'
      - '.github/workflows/farm-watch-hls-field-observations.yml'
      - '.github/workflows/farm-watch-hls-field-observations-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hls-field-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check HLS observation contract
        run: deno check supabase/functions/_shared/farm-watch-hls-field-observation-contract.ts

      - name: Test HLS observation contract
        run: deno test supabase/functions/_shared/farm-watch-hls-field-observation-contract.test.ts

      - name: Check protected worker
        run: deno check supabase/functions/farm-watch-field-phenology-worker/index.ts

      - name: Check GitHub OIDC trust module
        run: deno check supabase/functions/_shared/github-actions-oidc.ts

      - name: Check migration invariants
        run: deno run --allow-read scripts/check-farm-watch-hls-field-materializer-migration.ts

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HLS materializer dependencies
        run: >-
          python -m pip install
          numpy==2.1.3
          rasterio==1.4.3
          requests==2.32.5
          pystac==1.14.1
          pystac-client==0.9.0
          planetary-computer==1.0.0

      - name: Import and compile HLS materializer
        run: |
          python -c "import numpy, rasterio, requests, pystac, planetary_computer; from pystac_client import Client"
          python -m py_compile scripts/farm-watch-hls-field-observations.py
