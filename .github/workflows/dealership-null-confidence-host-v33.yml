name: Dealership host compatibility v33
on:
  push:
    branches: [fix/dealership-null-confidence-host-v33]
permissions:
  contents: write
jobs:
  patch-build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dealership-null-confidence-host-v33
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply host compatibility fix
        run: python .github/scripts/dealership_null_confidence_host_v33.py
      - name: Build and test Scout sandbox
        run: |
          cd supabase/functions/scout-component-sandbox-mcp
          npm ci
          npm run build
          npm test
      - name: Commit verified fix and remove temporary harness
        run: |
          rm .github/scripts/dealership_null_confidence_host_v33.py
          rm .github/workflows/dealership-null-confidence-host-v33.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Handle omitted unresolved dealership confidence in host view"
          git push origin HEAD:fix/dealership-null-confidence-host-v33
