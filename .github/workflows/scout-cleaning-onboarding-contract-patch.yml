name: Scout cleaning onboarding contract patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

concurrency:
  group: scout-cleaning-onboarding-contract-patch
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.event.issue.title == '[ops] Patch Scout cleaning onboarding MCP contract' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch typed onboarding schema
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/functions/scout-mcp/index.ts')
          text = path.read_text()

          old_rig = "const rigEquipmentItem=z.object({provider_equipment_id:z.string().uuid().optional(),model_id:z.string().uuid().optional(),name:z.string().min(1).max(160).optional(),quantity:z.number().int().min(1).max(100).optional(),role:z.string().min(1).max(80).optional()}).strict()\nconst rigItem=z.object({rig_id:z.string().uuid().optional(),name:z.string().min(2).max(120),status:z.enum(['active','inactive','seasonal','planned']).optional(),delivery_method:shortMachineKey.optional(),services:z.array(shortMachineKey).max(100).optional(),equipment:z.array(rigEquipmentItem).max(60).optional(),capabilities:z.array(rigCapability).max(100).optional()}).strict()"
          new_rig = "const rigEquipmentItem=z.object({provider_equipment_id:z.string().uuid().optional(),model_id:z.string().uuid().optional(),name:z.string().min(1).max(160).optional(),quantity:z.number().int().min(1).max(100).optional(),role:z.string().min(1).max(80).optional()}).strict()\nconst rigFluidRouteItem=z.object({fluid_route_id:z.string().uuid().optional(),name:z.string().min(2).max(160).optional(),route_kind:z.enum(['cleaning_delivery','window_wash','rinse','chemical_transfer','mixed_service','other']).optional(),route_role:shortMachineKey.optional(),service_slug:shortMachineKey.optional(),status:z.enum(['active','backup','planned','retired']).optional()}).strict().refine(v=>v.fluid_route_id!==undefined||v.name!==undefined,{message:'fluid route requires fluid_route_id or name'})\nconst rigProductItem=z.object({provider_product_id:z.string().uuid().optional(),product_id:z.string().uuid().optional(),name:z.string().min(1).max(200).optional(),manufacturer:z.string().min(1).max(200).optional(),product_kind:shortMachineKey.optional(),concentration_as_purchased_pct:z.number().min(0).max(100).optional(),default_mix:technicalJson.optional(),application_role:shortMachineKey.optional(),service_slug:shortMachineKey.optional(),fluid_route_id:z.string().uuid().optional(),fluid_route_name:z.string().min(2).max(160).optional(),service_mode:shortMachineKey.optional(),status:z.enum(['active','inactive','planned']).optional()}).strict().refine(v=>v.provider_product_id!==undefined||v.product_id!==undefined||v.name!==undefined,{message:'rig product requires provider_product_id, product_id, or name'})\nconst rigItem=z.object({rig_id:z.string().uuid().optional(),name:z.string().min(2).max(120),status:z.enum(['active','inactive','seasonal','planned']).optional(),delivery_method:shortMachineKey.optional(),services:z.array(shortMachineKey).max(100).optional(),equipment:z.array(rigEquipmentItem).max(60).optional(),capabilities:z.array(rigCapability).max(100).optional(),fluid_routes:z.array(rigFluidRouteItem).max(20).optional(),products:z.array(rigProductItem).max(60).optional()}).strict()"

          old_profile = "const profilePatch=z.object({business_name:z.string().min(1).max(200).optional(),dba_name:z.string().max(200).nullable().optional(),sector:z.string().min(2).max(200).optional(),home_base:z.string().min(2).max(200).optional(),operating_states:z.array(z.string().regex(/^[A-Za-z]{2}$/)).min(1).max(20).optional(),preferred_radius_miles:z.number().min(0).max(1000).nullable().optional(),max_travel_miles:z.number().min(0).max(1000).nullable().optional(),crew_size:z.number().int().min(1).max(10000).nullable().optional(),willing_to_subcontract:z.boolean().nullable().optional(),services:z.array(shortMachineKey).max(200).optional(),services_confirmed:z.boolean().optional(),equipment:z.array(equipmentItem).max(100).optional(),equipment_confirmed:z.boolean().optional(),credentials:z.array(credentialItem).max(100).optional(),credentials_confirmed:z.boolean().optional(),rigs:z.array(rigItem).min(1).max(25).optional(),rigs_confirmed:z.boolean().optional(),readiness:z.array(readinessItem).max(100).optional()}).strict()"
          new_profile = "const profilePatch=z.object({business_name:z.string().min(1).max(200).optional(),dba_name:z.string().max(200).nullable().optional(),sector:z.string().min(2).max(200).optional(),home_base:z.string().min(2).max(200).optional(),operating_states:z.array(z.string().regex(/^[A-Za-z]{2}$/)).min(1).max(20).optional(),preferred_radius_miles:z.number().min(0).max(1000).nullable().optional(),max_travel_miles:z.number().min(0).max(1000).nullable().optional(),crew_size:z.number().int().min(1).max(10000).nullable().optional(),willing_to_subcontract:z.boolean().nullable().optional(),services:z.array(shortMachineKey).max(200).optional(),services_confirmed:z.boolean().optional(),equipment:z.array(equipmentItem).max(100).optional(),equipment_confirmed:z.boolean().optional(),credentials:z.array(credentialItem).max(100).optional(),credentials_confirmed:z.boolean().optional(),rigs:z.array(rigItem).min(1).max(25).optional(),rigs_confirmed:z.boolean().optional(),cleaning_products_confirmed:z.boolean().optional(),readiness:z.array(readinessItem).max(100).optional()}).strict()"

          replacements = [
              (old_rig, new_rig, 'rig schema'),
              (old_profile, new_profile, 'profile schema'),
              ("version:'1.5.0'", "version:'1.5.1'", 'server version'),
              ("description:'Persist typed business setup, services, rigs, equipment, credentials, readiness, and progressive fields.'", "description:'Persist typed business setup, services, rigs, equipment, cleaning products/fluid routes, credentials, readiness, and progressive fields.'", 'profile tool description'),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- supabase/functions/scout-mcp/index.ts
      - name: Commit patch
        run: |
          git config user.name "Scout Ops"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/scout-mcp/index.ts
          git commit -m "Extend onboarding with rig cleaning setup"
          git push origin HEAD:main
