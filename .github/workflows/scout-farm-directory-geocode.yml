name: Scout farm directory geocoder

on:
  workflow_dispatch:
    inputs:
      max_records:
        description: "Maximum farm addresses to process (1-500)"
        required: false
        default: "100"
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: scout-farm-directory-geocoder
  cancel-in-progress: false

jobs:
  geocode:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == '[ops] Run Scout farm directory geocoder' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install dependency
        run: python -m pip install --upgrade requests
      - name: Verify geocoder logic
        run: python scripts/scout_farm_directory_geocoder.py --self-test
      - name: Geocode farm directory addresses
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_FARM_GEOCODE_MAX_RECORDS: ${{ github.event.inputs.max_records || '100' }}
          SCOUT_FARM_GEOCODE_QUEUE_SIZE: "50"
        run: python scripts/scout_farm_directory_geocoder.py
