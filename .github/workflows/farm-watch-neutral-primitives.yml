name: Farm Watch neutral primitive materialization

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write

jobs:
  materialize:
    if: >-
      github.actor == 'pmicka' &&
      github.event.issue.user.login == 'pmicka' &&
      (github.event.issue.title == '[ops] Materialize Farm Watch neutral primitives' ||
       github.event.issue.title == '[ops] Materialize Farm Watch solar exposure' ||
       github.event.issue.title == '[ops] Materialize Farm Watch thermal exposure')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check materializers
        run: |
          deno check scripts/farm-watch-neutral-primitives-materialize.ts
          deno check scripts/farm-watch-solar-exposure-materialize.ts
          deno check scripts/farm-watch-thermal-exposure-materialize.ts

      - name: Materialize neutral primitives
        if: github.event.issue.title == '[ops] Materialize Farm Watch neutral primitives'
        run: >-
          deno run
          --allow-env
          --allow-net
          scripts/farm-watch-neutral-primitives-materialize.ts
          --property validation-property-01

      - name: Materialize solar exposure
        if: github.event.issue.title == '[ops] Materialize Farm Watch solar exposure'
        run: >-
          deno run
          --allow-env
          --allow-net
          scripts/farm-watch-solar-exposure-materialize.ts
          --property validation-property-01

      - name: Materialize thermal exposure
        if: github.event.issue.title == '[ops] Materialize Farm Watch thermal exposure'
        run: >-
          deno run
          --allow-env
          --allow-net
          scripts/farm-watch-thermal-exposure-materialize.ts
          --property validation-property-01
