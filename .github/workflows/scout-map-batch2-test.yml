name: Scout map Batch 2 test

on:
  push:
    branches:
      - scout-pnc-map-renderer-batch2-20260912

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout-pnc-map-renderer-batch2-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact npm lockfile
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Run sandbox and renderer regression tests
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test
      - name: Fail if lockfile drifted
        run: git diff --exit-code -- supabase/functions/scout-component-sandbox-mcp/package-lock.json
