name: Scout map Batch 2 test

on:
  push:
    branches:
      - scout-pnc-map-renderer-batch2-20260912

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout-pnc-map-renderer-batch2-20260912
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Check production dependencies for critical advisories
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm audit --omit=dev --audit-level=critical
      - name: Run sandbox and renderer regression tests
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test
