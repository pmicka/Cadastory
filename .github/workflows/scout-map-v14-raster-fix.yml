name: Scout map v14 raster fix

on:
  push:
    branches:
      - scout-pnc-raster-map-hostfix-20260912

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout-pnc-raster-map-hostfix-20260912
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/functions/scout-component-sandbox-mcp/package-lock.json
      - name: Align gateways and regression gates
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in [Path('supabase/functions/scout-connect/index.ts'), Path('supabase/functions/scout-mcp-contract/index.ts')]:
              text = path.read_text()
              text = text.replace("const SANDBOX_RESOURCE_URI = 'ui://scout/component-sandbox/v13'", "const SANDBOX_RESOURCE_URI = 'ui://scout/component-sandbox/v14'")
              text = text.replace("const SANDBOX_COMPATIBILITY_RESOURCE_URIS = ['ui://scout/component-sandbox/v12'", "const SANDBOX_COMPATIBILITY_RESOURCE_URIS = ['ui://scout/component-sandbox/v13','ui://scout/component-sandbox/v12'")
              path.write_text(text)

          path = Path('supabase/functions/scout-component-sandbox-mcp/foundation_test.mjs')
          text = path.read_text()
          text = text.replace('assert.ok(server.includes("connectDomains: [MAP_RESOURCE_ORIGIN]"));', 'assert.ok(server.includes("csp: { resourceDomains: [MAP_TILE_ORIGIN] }"));')
          text = text.replace('assert.ok(buildView.includes(\'.replace("/*__SCOUT_VIEW_STYLE__*/", () => css)\'));', 'assert.equal(buildView.includes("__SCOUT_VIEW_STYLE__"), false);')
          text = text.replace('for (const version of ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "v9", "v10", "v11", "v12", "v13"]) {', 'for (const version of ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "v9", "v10", "v11", "v12", "v13", "v14"]) {')
          text = text.replace('assert.ok(mapContract.includes("legacy reference only"));', 'assert.ok(mapContract.includes("Git history is the reference archive"));')
          text = text.replace('assert.ok(generated.includes("maplibre"));\nassert.ok(generated.includes("https://tiles.openfreemap.org/styles/positron"));', 'assert.ok(generated.includes("tile.openstreetmap.org"));\nassert.equal(generated.includes("maplibre"), false);\nassert.equal(generated.includes("tiles.openfreemap.org"), false);')
          path.write_text(text)
          PY
      - name: Refresh exact package lock
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact UI dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Audit production UI dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm audit --omit=dev
      - name: Rebuild and test raster View
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: |
          npm run build
          npm test
      - name: Deno check Scout sandbox
        run: deno check supabase/functions/scout-component-sandbox-mcp/index.ts
      - name: Deno check Scout connect gateway
        run: deno check supabase/functions/scout-connect/index.ts
      - name: Deno check Scout contract gateway
        run: deno check supabase/functions/scout-mcp-contract/index.ts
      - name: Assert MapLibre and OpenFreeMap are gone from active sandbox
        run: |
          ! grep -R "maplibre\|tiles.openfreemap.org\|SCOUT_MAP_STYLE" supabase/functions/scout-component-sandbox-mcp --exclude-dir=node_modules --exclude=MAP_CONTRACT.md
          ! grep -R "maplibre-gl" supabase/functions/scout-component-sandbox-mcp/package-lock.json
          grep -q "tile.openstreetmap.org" supabase/functions/scout-component-sandbox-mcp/view.generated.ts
          grep -q "component-sandbox/v14" supabase/functions/scout-connect/index.ts
          grep -q "component-sandbox/v14" supabase/functions/scout-mcp-contract/index.ts
      - name: Commit generated and lockfile state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/functions/scout-component-sandbox-mcp/package-lock.json \
            supabase/functions/scout-component-sandbox-mcp/view.generated.ts \
            supabase/functions/scout-component-sandbox-mcp/foundation_test.mjs \
            supabase/functions/scout-connect/index.ts \
            supabase/functions/scout-mcp-contract/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "Finalize Scout raster map v14 [skip ci]"
            git push origin HEAD:scout-pnc-raster-map-hostfix-20260912
          fi
