name: Farm Watch deer Tier 1 context CI

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/farm-watch-deer-tier1-context-contract.ts'
      - 'supabase/functions/_shared/farm-watch-deer-tier1-context-contract.test.ts'
      - 'supabase/functions/collect-farm-watch-human-footprint/index.ts'
      - 'supabase/migrations/20260925152000_add_farm_watch_deer_tier1_context_v1.sql'
      - 'supabase/migrations/20260925154500_refine_farm_watch_human_footprint_building_source_v1.sql'
      - 'supabase/migrations/20260925162500_finalize_farm_watch_m36_road_focal_context_v1.sql'
      - 'supabase/migrations/20260925163500_finalize_farm_watch_m24_building_vintage_completeness_v1.sql'
      - 'supabase/migrations/20260925180500_finalize_farm_watch_m45_extreme_event_source_health_v1.sql'
      - 'docs/FARM_WATCH_DEER_TIER1_CONTEXT_V1.md'
      - '.github/workflows/farm-watch-deer-tier1-context-ci.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/_shared/farm-watch-deer-tier1-context-contract.ts'
      - 'supabase/functions/_shared/farm-watch-deer-tier1-context-contract.test.ts'
      - 'supabase/functions/collect-farm-watch-human-footprint/index.ts'
      - 'supabase/migrations/20260925152000_add_farm_watch_deer_tier1_context_v1.sql'
      - 'supabase/migrations/20260925154500_refine_farm_watch_human_footprint_building_source_v1.sql'
      - 'supabase/migrations/20260925162500_finalize_farm_watch_m36_road_focal_context_v1.sql'
      - 'supabase/migrations/20260925163500_finalize_farm_watch_m24_building_vintage_completeness_v1.sql'
      - 'supabase/migrations/20260925180500_finalize_farm_watch_m45_extreme_event_source_health_v1.sql'
      - '.github/workflows/farm-watch-deer-tier1-context-ci.yml'

jobs:
  deer-tier1-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Tier 1 contract
        run: deno check supabase/functions/_shared/farm-watch-deer-tier1-context-contract.ts
      - name: Test Tier 1 contract
        run: deno test supabase/functions/_shared/farm-watch-deer-tier1-context-contract.test.ts
      - name: Check human-footprint collector
        run: deno check supabase/functions/collect-farm-watch-human-footprint/index.ts
      - name: Check Tier 1 science boundaries
        run: |
          set -euo pipefail
          file='supabase/migrations/20260925152000_add_farm_watch_deer_tier1_context_v1.sql'
          grep -q "building_study_area_km2',10.36" "$file"
          grep -q "jsonb_build_array(30,90,270)" "$file"
          grep -q "array\[1,9\]" "$file"
          grep -q "ordinary_weather_activation_allowed',false" "$file"
          grep -q "Severe thunderstorms, routine wind, ordinary rainfall" "$file"
          grep -q "deer_inference_performed',false" "$file"

      - name: Check FEMA building-source refinement
        run: |
          set -euo pipefail
          file='supabase/migrations/20260925154500_refine_farm_watch_human_footprint_building_source_v1.sql'
          grep -q "fema-usastructures-osm-human-footprint-v1" "$file"
          grep -q "fema-usa-structures-current" "$file"
          grep -q "USA_Structures_View/FeatureServer/0" "$file"

      - name: Check M36 source-style road focal evaluator
        run: |
          set -euo pipefail
          file='supabase/migrations/20260925162500_finalize_farm_watch_m36_road_focal_context_v1.sql'
          grep -q "stephens-road-distance-focal-10m-v1" "$file"
          grep -q "study_road_raster_resolution_m',10" "$file"
          grep -q "study_focal_radii_m',jsonb_build_array(30,90,270)" "$file"
          grep -q "coefficient_transfer_performed',false" "$file"
          grep -q "deer_inference_performed',false" "$file"

      - name: Check M24 source-vintage completeness contract
        run: |
          set -euo pipefail
          file='supabase/migrations/20260925163500_finalize_farm_watch_m24_building_vintage_completeness_v1.sql'
          grep -q "fema-usastructures-osm-human-footprint-v2" "$file"
          grep -q "known_minimum_structure_area_sqft.*450" "$file"
          grep -q "spatial_completeness_status.*not_quantified_by_source" "$file"
          grep -q "building_source_profile_sha256" "$file"
          grep -q "local_feature_vintage" supabase/functions/collect-farm-watch-human-footprint/index.ts
          grep -q "outStatistics" supabase/functions/collect-farm-watch-human-footprint/index.ts

      - name: Check M45 event source-health gate
        run: |
          set -euo pipefail
          file='supabase/migrations/20260925180500_finalize_farm_watch_m45_extreme_event_source_health_v1.sql'
          grep -q "nws-tropical-extreme-event-gate-v2" "$file"
          grep -q "nws_alert_poll_status_v1" "$file"
          grep -q "http_status is distinct from 200" "$file"
          grep -q "unresolved_qualifying_event_count" "$file"
          grep -q "applicability_state" "$file"
          grep -q "not_applicable" "$file"
          grep -q "source_unavailable" "$file"
          grep -q "e.status='Actual'" "$file"
          grep -q "ordinary_weather_activation_allowed',false" "$file"
