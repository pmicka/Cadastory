name: Temporary Scout download transport probe bootstrap

on:
  push:
    branches:
      - scout/download-transport-probe

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply isolated probe patch
        run: node scripts/tmp_scout_download_transport_probe_patch.mjs

      - name: Install sandbox dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci

      - name: Build generated View
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run build

      - name: Run full sandbox suite
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test

      - name: Run sandbox contract smoke
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run smoke:contract

      - name: Commit verified probe and remove bootstrap scaffolding
        shell: bash
        run: |
          rm -f scripts/tmp_scout_download_transport_probe_patch.mjs
          rm -f .github/workflows/tmp-scout-download-probe-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Add isolated MCP Apps download transport probe"
          git push origin HEAD:scout/download-transport-probe
