name: Scout water tank map renderer Batch 2

on:
  push:
    branches:
      - scout-water-tank-map-renderer-batch2-20260912

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout-water-tank-map-renderer-batch2-20260912
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/functions/scout-component-sandbox-mcp/package-lock.json
      - name: Preserve current generated View
        run: cp supabase/functions/scout-component-sandbox-mcp/view.generated.ts /tmp/view.generated.before.ts
      - name: Install exact UI dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Audit production UI dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm audit --omit=dev
      - name: Build current View
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run build
      - name: Assert current v15 View bundle is byte-for-byte unchanged
        run: cmp /tmp/view.generated.before.ts supabase/functions/scout-component-sandbox-mcp/view.generated.ts
      - name: Run sandbox regression suite
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test
      - name: Deno check isolated water tank renderer
        run: |
          deno check supabase/functions/scout-component-sandbox-mcp/water_tank_map_model.ts
          deno check supabase/functions/scout-component-sandbox-mcp/water_tank_map_renderer.ts
      - name: Deno check live sandbox entrypoints
        run: |
          deno check supabase/functions/scout-component-sandbox-mcp/index.ts
          deno check supabase/functions/scout-connect/index.ts
          deno check supabase/functions/scout-mcp-contract/index.ts
      - name: Assert Batch 2 remains isolated
        run: |
          grep -q "buildScoutCenteredPointRasterFrame" supabase/functions/scout-component-sandbox-mcp/single_site_map_renderer.ts
          grep -q "SCOUT_WATER_TANK_POINT_ZOOM = 17" supabase/functions/scout-component-sandbox-mcp/water_tank_map_model.ts
          grep -q "buildScoutWaterTankRasterFrame" supabase/functions/scout-component-sandbox-mcp/water_tank_map_renderer.ts
          ! grep -q "water_tank_map_renderer" supabase/functions/scout-component-sandbox-mcp/view.ts
          ! grep -q "water_tank_map_model" supabase/functions/scout-component-sandbox-mcp/view.ts
          ! grep -q "scout_get_component_sandbox_water_tank_map_v1_internal" supabase/functions/scout-component-sandbox-mcp/index.ts
          ! grep -q "water_tank_single_site_map_v1" supabase/functions/scout-component-sandbox-mcp/view.generated.ts
          ! grep -E "window.openai|openai/outputTemplate|openai/widgetAccessible|openai/widgetDescription|openai/widgetCSP" \
            supabase/functions/scout-component-sandbox-mcp/single_site_map_renderer.ts \
            supabase/functions/scout-component-sandbox-mcp/water_tank_map_model.ts \
            supabase/functions/scout-component-sandbox-mcp/water_tank_map_renderer.ts
