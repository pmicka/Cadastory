name: Scout SAM opportunities

on:
  schedule:
    - cron: '17 9 * * *'
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: scout-sam-opportunities
  cancel-in-progress: false

jobs:
  sam-opportunities:
    if: ${{ github.event_name == 'schedule' || github.event.issue.title == '[ops] Run Scout SAM opportunities' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install collector dependencies
        run: python -m pip install --upgrade requests python-dateutil
      - name: Populate SAM Contract Opportunities
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_SAM_STATES: "KY,IN,OH"
          SCOUT_SAM_BATCH_SIZE: "100"
          SCOUT_SAM_INCLUDE_STRATEGIC_NATIONAL: "1"
        run: python scripts/scout_sam_opportunities_loader.py
