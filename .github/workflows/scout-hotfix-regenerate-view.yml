name: Scout hotfix regenerate view

on:
  push:
    branches:
      - scout/school-rpc-name-fix

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/scout-component-sandbox-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout/school-rpc-name-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/functions/scout-component-sandbox-mcp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Regenerate view
        run: npm run build
      - name: Commit generated view if changed
        working-directory: .
        run: |
          if git diff --quiet -- supabase/functions/scout-component-sandbox-mcp/view.generated.ts; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/scout-component-sandbox-mcp/view.generated.ts
          git commit -m 'Regenerate Scout view after RPC hotfix'
          git push origin HEAD:scout/school-rpc-name-fix
