name: Scout per-result raster transport bootstrap

# Temporary branch-only bootstrap; removed before merge.
on:
  push:
    branches:
      - scout/per-result-raster-transport
    paths:
      - .github/workflows/scout-raster-transport-bootstrap.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout/per-result-raster-transport
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/functions/scout-component-sandbox-mcp/package-lock.json
      - name: Apply raster transport hardening
        run: |
          python3 scripts/apply_per_result_raster_transport.py
          python3 scripts/patch_per_result_raster_tests.py
          python3 scripts/patch_per_result_manifest_reference.py
          python3 scripts/patch_per_result_resource_tests.py
      - name: Install sandbox dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Regenerate MCP Apps View
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run build
      - name: Run complete sandbox suite
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test
      - name: Run predeploy registry smoke
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run smoke:contract
      - name: Commit generated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions-bot@users.noreply.github.com'
          git add supabase/functions
          if git diff --cached --quiet; then
            echo 'No durable changes produced.'
            exit 1
          fi
          git commit -m 'Move sandbox raster embedding to tool results'
          git push origin HEAD:scout/per-result-raster-transport
