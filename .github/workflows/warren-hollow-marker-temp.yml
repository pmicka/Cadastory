name: Warren hollow marker batch

on:
  push:
    branches:
      - fix/warren-not-in-service-hollow-marker

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/warren-not-in-service-hollow-marker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply source patch
        run: python .github/scripts/warren_hollow_marker.py
      - name: Build and test Scout sandbox
        run: |
          cd supabase/functions/scout-component-sandbox-mcp
          npm ci
          npm run build
          npm test
      - name: Commit verified changes
        run: |
          rm .github/workflows/warren-hollow-marker-temp.yml
          rm .github/scripts/warren_hollow_marker.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use hollow markers for inactive Warren tanks"
          git push origin HEAD:fix/warren-not-in-service-hollow-marker
