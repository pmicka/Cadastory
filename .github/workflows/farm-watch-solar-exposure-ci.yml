name: Farm Watch solar exposure CI

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/farm-watch-solar-exposure-contract.ts'
      - 'supabase/functions/_shared/farm-watch-solar-exposure.ts'
      - 'supabase/functions/_shared/farm-watch-solar-exposure.test.ts'
      - 'supabase/functions/_shared/farm-watch-presentation-policy.ts'
      - 'supabase/functions/_shared/farm-watch-presentation-policy.test.ts'
      - 'supabase/functions/farm-watch-materialization/index.ts'
      - 'scripts/farm-watch-solar-exposure-materialize.ts'
      - '.github/workflows/farm-watch-neutral-primitives.yml'
      - '.github/workflows/farm-watch-solar-exposure-ci.yml'
      - 'docs/FARM_WATCH_SOLAR_EXPOSURE_V1.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_IMPLEMENTATION_PLAN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solar-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check solar contracts
        run: deno check supabase/functions/_shared/farm-watch-solar-exposure-contract.ts
      - name: Check solar physics
        run: deno check supabase/functions/_shared/farm-watch-solar-exposure.ts
      - name: Test solar physics
        run: deno test supabase/functions/_shared/farm-watch-solar-exposure.test.ts
      - name: Test presentation policy
        run: deno test supabase/functions/_shared/farm-watch-presentation-policy.test.ts
      - name: Check materialization edge
        run: deno check supabase/functions/farm-watch-materialization/index.ts
      - name: Check solar materializer
        run: deno check scripts/farm-watch-solar-exposure-materialize.ts
