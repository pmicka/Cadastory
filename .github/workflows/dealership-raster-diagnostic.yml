name: Dealership raster diagnostic

on:
  push:
    branches:
      - fix/dealership-map-raster-diagnostics

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check live bounded dealership tiles
        shell: bash
        run: |
          set -euo pipefail
          base='https://ufpkjaadmmpmeogzhrcq.supabase.co/functions/v1/scout-component-sandbox-mcp/map-tile'
          upstream='https://a.tile.openstreetmap.fr/hot'
          for x in 66 67 68; do
            for y in 98 99; do
              echo "=== live 8/$x/$y ==="
              curl -sS -L -D headers.txt -o tile.png "$base/8/$x/$y.png"
              status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' headers.txt)
              ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' headers.txt | tail -1)
              bytes=$(wc -c < tile.png)
              echo "status=$status content_type=$ctype bytes=$bytes data_url_chars=$((bytes*4/3+32))"
              file tile.png
              echo "=== upstream 8/$x/$y ==="
              curl -sS -L -D upstream_headers.txt -o upstream.png "$upstream/8/$x/$y.png"
              up_status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' upstream_headers.txt)
              up_ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {gsub("\r",""); print $2}' upstream_headers.txt | tail -1)
              up_bytes=$(wc -c < upstream.png)
              echo "status=$up_status content_type=$up_ctype bytes=$up_bytes data_url_chars=$((up_bytes*4/3+32))"
              cmp -s tile.png upstream.png && echo 'live_matches_upstream=yes' || echo 'live_matches_upstream=no'
            done
          done
      - name: Verify responsive frame tile set
        run: |
          node <<'NODE'
          const west=-85.934878659,east=-84.441854524,south=37.345356171,north=37.997225146,T=256;
          const wx=lon=>(lon+180)/360;
          const wy=lat=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2};
          function fit(width,height,padding=24){
            const usableWidth=Math.max(1,width-padding*2),usableHeight=Math.max(1,height-padding*2);
            const spanX=Math.abs(wx(east)-wx(west)),spanY=Math.abs(wy(south)-wy(north));
            for(let z=18;z>=5;z--){const world=T*2**z;if(spanX*world<=usableWidth&&spanY*world<=usableHeight)return z}
            return 5;
          }
          function frame(width,height){
            const z=fit(width,height),world=T*2**z;
            const cx=((wx(west)+wx(east))/2)*world,cy=((wy(north)+wy(south))/2)*world;
            const left=cx-width/2,top=cy-height/2;
            const sx=Math.floor(left/T),ex=Math.floor((left+width-1)/T),sy=Math.floor(top/T),ey=Math.floor((top+height-1)/T);
            const tiles=[];for(let x=sx;x<=ex;x++)for(let y=sy;y<=ey;y++)tiles.push(`${z}/${x}/${y}`);
            console.log({width,height,z,tiles});
          }
          for (const width of [280,320,344,360,408,456]) frame(width,210);
          NODE
