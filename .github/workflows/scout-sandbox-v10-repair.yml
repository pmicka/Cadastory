name: Scout sandbox v10 repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/scout-sandbox-v10-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align sandbox resource and schemas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('supabase/functions')
          sandbox = root / 'scout-component-sandbox-mcp' / 'index.ts'
          connect = root / 'scout-connect' / 'index.ts'
          contract = root / 'scout-mcp-contract' / 'index.ts'
          test = root / 'scout-component-sandbox-mcp' / 'foundation_test.mjs'

          for path, canonical_name in [
              (sandbox, 'RESOURCE_URI'),
              (connect, 'SANDBOX_RESOURCE_URI'),
              (contract, 'SANDBOX_RESOURCE_URI'),
          ]:
              text = path.read_text()
              old = f"const {canonical_name} = 'ui://scout/component-sandbox/v9'"
              new = f"const {canonical_name} = 'ui://scout/component-sandbox/v10'"
              if old not in text:
                  raise SystemExit(f'missing canonical v9 marker in {path}')
              text = text.replace(old, new, 1)
              old_compat = "['ui://scout/component-sandbox/v8','ui://scout/component-sandbox/v7','ui://scout/component-sandbox/v6','ui://scout/component-sandbox/v5','ui://scout/component-sandbox/v4','ui://scout/component-sandbox/v3','ui://scout/component-sandbox/v2','ui://scout/component-sandbox/v1']"
              if path == sandbox:
                  old_compat = "[\n  'ui://scout/component-sandbox/v8',\n  'ui://scout/component-sandbox/v7',\n  'ui://scout/component-sandbox/v6',\n  'ui://scout/component-sandbox/v5',\n  'ui://scout/component-sandbox/v4',\n  'ui://scout/component-sandbox/v3',\n  'ui://scout/component-sandbox/v2',\n  'ui://scout/component-sandbox/v1',\n] as const"
                  new_compat = "[\n  'ui://scout/component-sandbox/v9',\n  'ui://scout/component-sandbox/v8',\n  'ui://scout/component-sandbox/v7',\n  'ui://scout/component-sandbox/v6',\n  'ui://scout/component-sandbox/v5',\n  'ui://scout/component-sandbox/v4',\n  'ui://scout/component-sandbox/v3',\n  'ui://scout/component-sandbox/v2',\n  'ui://scout/component-sandbox/v1',\n] as const"
              else:
                  new_compat = "['ui://scout/component-sandbox/v9','ui://scout/component-sandbox/v8','ui://scout/component-sandbox/v7','ui://scout/component-sandbox/v6','ui://scout/component-sandbox/v5','ui://scout/component-sandbox/v4','ui://scout/component-sandbox/v3','ui://scout/component-sandbox/v2','ui://scout/component-sandbox/v1']"
              if old_compat not in text:
                  raise SystemExit(f'missing compatibility marker in {path}')
              text = text.replace(old_compat, new_compat, 1)
              path.write_text(text)

          schema = """function sandboxTool(){return {name:SANDBOX_TOOL,title:'Preview Scout opportunity card',description:'Owner-only read-only developer tool that renders the bounded Scout MCP Apps opportunity card. Call only when the Scout owner explicitly asks to test or preview the Scout sandbox UI foundation.',inputSchema:{type:'object',properties:{},additionalProperties:false},outputSchema:{type:'object',properties:{surface:{type:'string',enum:['scout_component_sandbox']},names:{type:'array',maxItems:2,items:{type:'string',minLength:1,maxLength:160}},opportunity:{type:'object',properties:{name:{type:'string',minLength:1,maxLength:160},address:{type:'string',minLength:1,maxLength:240},opportunity_tier:{type:'string',minLength:1,maxLength:64},opportunity_score:{type:'integer',minimum:0,maximum:100},confidence:{type:'number',minimum:0,maximum:1},story_count:{type:'integer',minimum:0,maximum:1000},height_m:{type:'number',minimum:0,maximum:10000},footprint_sqft:{type:'number',minimum:0,maximum:1000000000},glazing_status:{type:'string',minLength:1,maxLength:80},observed_at:{type:'string',minLength:1,maxLength:80},target_class:{type:'string',minLength:1,maxLength:80},target_subclass:{type:'string',minLength:1,maxLength:80},buyer_resolvability:{type:'string',minLength:1,maxLength:120},guardrail:{type:'string',minLength:1,maxLength:1000}},required:['name','address','opportunity_tier','opportunity_score','confidence','story_count','height_m','footprint_sqft','glazing_status','observed_at','target_class','target_subclass','buyer_resolvability','guardrail'],additionalProperties:false}},required:['surface','names','opportunity'],additionalProperties:false},annotations:{readOnlyHint:true,destructiveHint:false,idempotentHint:true,openWorldHint:false},_meta:{ui:{resourceUri:SANDBOX_RESOURCE_URI}}}}"""

          for path in (connect, contract):
              text = path.read_text()
              pattern = r"function sandboxTool\(\)\{return \{.*?\}\}\nfunction sandboxResource\(\)"
              replaced, count = re.subn(pattern, schema + "\nfunction sandboxResource()", text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'could not replace sandbox tool schema in {path}: {count}')
              path.write_text(replaced)

          text = test.read_text()
          old = 'for (const version of ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "v9"]) {'
          new = 'for (const version of ["v1", "v2", "v3", "v4", "v5", "v6", "v7", "v8", "v9", "v10"]) {'
          if old not in text:
              raise SystemExit('missing version assertion marker')
          text = text.replace(old, new, 1)
          marker = 'assert.ok(server.includes("opportunity: z.object"));\n'
          extra = marker + 'assert.ok(connectGateway.includes("opportunity:{type:\'object\'"));\nassert.ok(contractGateway.includes("opportunity:{type:\'object\'"));\n'
          if marker not in text:
              raise SystemExit('missing gateway assertion insertion marker')
          text = text.replace(marker, extra, 1)
          test.write_text(text)
          PY
      - name: Build and test Scout sandbox
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: |
          npm ci
          npm run build
          npm test
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/scout-component-sandbox-mcp/index.ts \
                  supabase/functions/scout-component-sandbox-mcp/foundation_test.mjs \
                  supabase/functions/scout-connect/index.ts \
                  supabase/functions/scout-mcp-contract/index.ts \
                  supabase/functions/scout-component-sandbox-mcp/view.generated.ts
          git diff --cached --check
          git commit -m "Bust Scout sandbox cache and align gateway contract"
          git push origin HEAD:main
