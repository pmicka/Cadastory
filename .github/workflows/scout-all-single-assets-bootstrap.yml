name: Scout all single-assets bootstrap

on:
  push:
    branches:
      - scout/all-single-asset-opportunities
    paths:
      - .github/workflows/scout-all-single-assets-bootstrap.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout/all-single-asset-opportunities
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/functions/scout-component-sandbox-mcp/package-lock.json
      - name: Apply single-asset batch
        run: |
          python3 scripts/patch_all_single_asset_generator.py
          python3 scripts/apply_all_single_asset_sandbox.py
      - name: Install sandbox dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Regenerate MCP Apps View
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run build
      - name: Run complete sandbox suite
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test
      - name: Run predeploy registry smoke
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run smoke:contract
      - name: Commit generated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions supabase/migrations
          if git diff --cached --quiet; then
            echo 'No durable changes produced.'
            exit 1
          fi
          git commit -m 'Add remaining generic single-asset sandbox types'
          git push origin HEAD:scout/all-single-asset-opportunities

# Temporary bootstrap workflow. Remove before PR review after full suite + smoke pass.
