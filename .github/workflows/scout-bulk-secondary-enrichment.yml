name: Scout OSM and NRHP bulk enrichment

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: scout-osm-nrhp-bulk-enrichment
  cancel-in-progress: false

jobs:
  osm:
    if: ${{ github.event.issue.title == '[ops] Run Scout OSM and NRHP bulk enrichment' }}
    name: OSM building attributes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade requests
      - name: Load explicit OSM building attributes
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_OSM_BUILDING_BATCH_SIZE: "100"
        run: python scripts/scout_osm_building_attribute_loader.py

  nrhp:
    if: ${{ github.event.issue.title == '[ops] Run Scout OSM and NRHP bulk enrichment' }}
    name: National Register historic resources
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependencies
        run: python -m pip install --upgrade requests
      - name: Load NRHP points and polygons
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_NRHP_STATES: "KY,IN,OH"
          SCOUT_NRHP_BATCH_SIZE: "100"
        run: python scripts/scout_nrhp_historic_resource_loader.py
