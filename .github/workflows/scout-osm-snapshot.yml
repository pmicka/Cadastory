name: Scout OSM access snapshot

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Optional comma-separated regions: kentucky,indiana,ohio"
        required: false
        default: ""
      resume_region:
        description: "Legacy-compatible region to resume without downloading or re-uploading"
        required: false
        default: ""
      finalize_only_region:
        description: "Optional region to finalize only; skips download and upload"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade requests

      - name: Load Scout access snapshot
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_OSM_REGIONS: ${{ inputs.regions }}
          SCOUT_OSM_BATCH_SIZE: "500"
          SCOUT_OSM_FINALIZE_BATCH_SIZE: "5000"
          SCOUT_OSM_CLEANUP_BATCH_SIZE: "1000"
          SCOUT_OSM_RESUME_REGION: ${{ inputs.resume_region }}
          SCOUT_OSM_FINALIZE_ONLY_REGION: ${{ inputs.finalize_only_region }}
        run: |
          if [ -n "$SCOUT_OSM_FINALIZE_ONLY_REGION" ]; then
            python scripts/scout_osm_snapshot_loader_retry.py --finalize-only "$SCOUT_OSM_FINALIZE_ONLY_REGION"
          else
            python scripts/scout_osm_snapshot_loader_retry.py
          fi
