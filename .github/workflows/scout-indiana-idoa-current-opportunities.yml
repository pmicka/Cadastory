name: Scout Indiana IDOA current opportunities

on:
  schedule:
    - cron: '43 10 * * *'
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: scout-indiana-idoa-current-opportunities
  cancel-in-progress: false

jobs:
  indiana-idoa-current:
    if: ${{ github.event_name == 'schedule' || github.event.issue.title == '[ops] Run Scout Indiana IDOA current opportunities' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install collector dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 python-dateutil
      - name: Load current Indiana procurement opportunities
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_IDOA_CURRENT_BATCH_SIZE: "100"
        run: python scripts/scout_indiana_idoa_opportunities_loader.py
