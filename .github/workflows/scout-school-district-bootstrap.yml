name: Scout school district portfolio bootstrap

on:
  push:
    branches:
      - scout/school-district-portfolio
    paths:
      - scripts/scout_school_district_portfolio_bootstrap.py
      - .github/workflows/scout-school-district-bootstrap.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout/school-district-portfolio
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply implementation
        run: python3 scripts/scout_school_district_portfolio_bootstrap.py
      - name: Install sandbox dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Build generated View
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run build
      - name: Run full sandbox suite
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test
      - name: Run predeploy smoke
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run smoke:contract
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions supabase/migrations
          git diff --cached --quiet && exit 0
          git commit -m 'Add school district portfolio sandbox'
          git push origin HEAD:scout/school-district-portfolio
