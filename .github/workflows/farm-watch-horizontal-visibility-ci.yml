name: Farm Watch horizontal visibility CI

on:
  pull_request:
    paths:
      - 'docs/FARM_WATCH_DEER_SCIENCE_IMPLEMENTATION_PLAN.md'
      - 'docs/FARM_WATCH_STRUCTURE_EVIDENCE_LEDGER.md'
      - 'supabase/functions/_shared/farm-watch-horizontal-visibility-contract.ts'
      - 'supabase/functions/_shared/farm-watch-horizontal-visibility.ts'
      - 'supabase/functions/_shared/farm-watch-horizontal-visibility.test.ts'
      - 'supabase/functions/_shared/farm-watch-presentation-policy.ts'
      - 'supabase/functions/_shared/farm-watch-presentation-policy.test.ts'
      - 'supabase/functions/farm-watch-materialization/index.ts'
      - 'scripts/farm-watch-horizontal-visibility-materialize.ts'
      - '.github/workflows/farm-watch-horizontal-visibility-ci.yml'
      - '.github/workflows/farm-watch-horizontal-visibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  horizontal-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check horizontal visibility contract
        run: deno check supabase/functions/_shared/farm-watch-horizontal-visibility-contract.ts
      - name: Check horizontal visibility builder
        run: deno check supabase/functions/_shared/farm-watch-horizontal-visibility.ts
      - name: Run horizontal visibility physics and contract tests
        run: deno test supabase/functions/_shared/farm-watch-horizontal-visibility.test.ts
      - name: Check presentation policy
        run: deno check supabase/functions/_shared/farm-watch-presentation-policy.ts
      - name: Test presentation policy
        run: deno test supabase/functions/_shared/farm-watch-presentation-policy.test.ts
      - name: Check materialization edge
        run: deno check supabase/functions/farm-watch-materialization/index.ts
      - name: Check materializer
        run: deno check scripts/farm-watch-horizontal-visibility-materialize.ts
