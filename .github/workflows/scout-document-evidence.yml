name: Scout document evidence worker

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Jobs to claim (1-50)"
        required: false
        default: "6"
      rule_pack:
        description: "Optional rule pack filter"
        required: false
        default: ""
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: scout-document-evidence-worker
  cancel-in-progress: false

jobs:
  extract:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == '[ops] Run Scout document evidence worker' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install document tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade requests
          pdftotext -v

      - name: Verify rule packs
        run: python scripts/scout_document_evidence_worker.py --self-test

      - name: Process evidence queue
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_DOCUMENT_BATCH_SIZE: ${{ github.event.inputs.batch_size || '6' }}
          SCOUT_DOCUMENT_RULE_PACK: ${{ github.event.inputs.rule_pack || '' }}
          SCOUT_DOCUMENT_MAX_BYTES: "41943040"
          SCOUT_BUYER_MAX_SEARCHES: "2"
          SCOUT_BUYER_MAX_PAGES: "8"
        run: python scripts/scout_document_evidence_worker.py
