name: Sandbox registry hardening bootstrap

on:
  push:
    branches:
      - scout/sandbox-registry-hardening

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/functions/scout-component-sandbox-mcp/package-lock.json
      - name: Tighten bootstrap matchers
        run: python3 scripts/repair_sandbox_bootstrap.py
      - name: Apply bounded architecture refactor
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/bootstrap_sandbox_registry_hardening.py 2>&1 | tee sandbox-bootstrap.log
      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-bootstrap-diagnostics
          path: sandbox-bootstrap.log
      - name: Install sandbox dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Regenerate MCP Apps View
        working-directory: supabase/functions/scout-component-sandbox-mcp
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee sandbox-build.log
      - name: Run complete sandbox suite
        working-directory: supabase/functions/scout-component-sandbox-mcp
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee sandbox-test.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-build-diagnostics
          path: |
            supabase/functions/scout-component-sandbox-mcp/sandbox-build.log
            supabase/functions/scout-component-sandbox-mcp/sandbox-test.log
          if-no-files-found: ignore
      - name: Commit verified refactor
        run: |
          rm scripts/bootstrap_sandbox_registry_hardening.py
          rm scripts/repair_sandbox_bootstrap.py
          rm .github/workflows/sandbox-registry-bootstrap.yml
          rm -f supabase/functions/scout-component-sandbox-mcp/sandbox-build.log
          rm -f supabase/functions/scout-component-sandbox-mcp/sandbox-test.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden sandbox portfolio registry architecture'
          git push origin HEAD:scout/sandbox-registry-hardening
