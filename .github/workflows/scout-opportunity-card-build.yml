name: Scout opportunity card build

on:
  push:
    branches:
      - scout-opportunity-card-build-20260911

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/functions/scout-component-sandbox-mcp/package-lock.json
      - name: Install sandbox build dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Generate bundled MCP Apps view
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run build
      - name: Run sandbox lifecycle and artifact checks
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test
      - name: Commit generated view to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/scout-component-sandbox-mcp/view.generated.ts
          if git diff --cached --quiet; then
            echo "Generated view already current"
            exit 0
          fi
          git commit -m "Build Scout opportunity card view"
          git push origin HEAD:${GITHUB_REF_NAME}
