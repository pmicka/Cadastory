name: Deploy Scout opportunity card

on:
  push:
    branches:
      - scout-opportunity-card-build-20260911

permissions:
  contents: read

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b0b2f31b47927453b324fe3e0222e4fa2ec7e007
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy exact main function source
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy scout-component-sandbox-mcp --project-ref ufpkjaadmmpmeogzhrcq --no-verify-jwt
