name: Farm Watch authoritative source identity CI

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/farm-watch-external-source-identity.ts'
      - 'supabase/functions/_shared/farm-watch-lidar-source.ts'
      - 'supabase/functions/_shared/farm-watch-leaf-off-contract.ts'
      - 'supabase/functions/_shared/farm-watch-tcc-contract.ts'
      - 'supabase/functions/_shared/farm-watch-neutral-primitives-contract.ts'
      - 'supabase/functions/_shared/farm-watch-neutral-primitives.ts'
      - 'supabase/functions/_shared/farm-watch-solar-exposure-contract.ts'
      - 'supabase/functions/_shared/farm-watch-solar-exposure.ts'
      - 'supabase/functions/farm-watch-materialization/index.ts'
      - 'supabase/functions/farm-watch-private/index.ts'
      - 'supabase/functions/farm-watch-leaf-off-worker/index.ts'
      - 'supabase/functions/farm-watch-lidar-worker/index.ts'
      - 'supabase/functions/farm-watch-landscape-structure-worker/index.ts'
      - 'supabase/functions/farm-watch-study-vegetation-height-worker/index.ts'
      - 'supabase/functions/farm-watch-mast-capacity-worker/index.ts'
      - 'supabase/functions/farm-watch-structure-synthesis-worker/index.ts'
      - 'supabase/migrations/*authoritative_external_source_identity*.sql'
      - 'supabase/migrations/*short_external_dependency_rpc*.sql'
      - 'scripts/check-farm-watch-external-source-identities.ts'
      - 'scripts/farm-watch-lidar-physical-materialize.ts'
      - 'scripts/farm-watch-leaf-off-materialize.ts'
      - 'scripts/farm-watch-terrain-materialize.ts'
      - 'docs/FARM_WATCH_MATERIALIZATION_DEPENDENCY_MANIFEST_V1.md'
      - '.github/workflows/farm-watch-authoritative-source-identity-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check source identity resolver
        run: |
          deno check supabase/functions/_shared/farm-watch-external-source-identity.ts
          deno check supabase/functions/_shared/farm-watch-neutral-primitives.ts
          deno check supabase/functions/_shared/farm-watch-solar-exposure.ts
      - name: Check affected protected workers
        run: |
          deno check supabase/functions/farm-watch-materialization/index.ts
          deno check supabase/functions/farm-watch-private/index.ts
          deno check supabase/functions/farm-watch-leaf-off-worker/index.ts
          deno check supabase/functions/farm-watch-lidar-worker/index.ts
          deno check supabase/functions/farm-watch-landscape-structure-worker/index.ts
          deno check supabase/functions/farm-watch-study-vegetation-height-worker/index.ts
          deno check supabase/functions/farm-watch-mast-capacity-worker/index.ts
          deno check supabase/functions/farm-watch-structure-synthesis-worker/index.ts
      - name: Check operational materializers
        run: |
          deno check scripts/farm-watch-lidar-physical-materialize.ts
          deno check scripts/farm-watch-leaf-off-materialize.ts
          deno check scripts/farm-watch-terrain-materialize.ts
      - name: Check deterministic source identity contract
        run: deno run --allow-read scripts/check-farm-watch-external-source-identities.ts
      - name: Inspect BIGMAP checksum gateway
        run: deno run --allow-net --allow-read scripts/check-farm-watch-external-source-identities.ts --bigmap-diagnostic
      - name: Probe authoritative external sources
        run: deno run --allow-net --allow-read scripts/check-farm-watch-external-source-identities.ts --live
