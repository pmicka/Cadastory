name: Scout Warren portfolio sandbox branch build

on:
  push:
    branches:
      - scout/warren-portfolio-sandbox
    paths:
      - 'supabase/functions/scout-component-sandbox-mcp/**'
      - 'supabase/functions/_shared/scout_sandbox_water_portfolio_schema.ts'
      - 'supabase/functions/scout-connect/index.ts'
      - 'supabase/functions/scout-mcp-contract/index.ts'
      - '.github/workflows/scout-warren-portfolio-sandbox-branch-build.yml'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout/warren-portfolio-sandbox
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/functions/scout-component-sandbox-mcp/package-lock.json
      - name: Align sandbox gateway contracts
        run: node supabase/functions/scout-component-sandbox-mcp/patch_warren_portfolio_gateways.mjs
      - name: Install sandbox dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Build MCP Apps view bundle
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run build
      - name: Run sandbox tests
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test
      - name: Commit branch build outputs when changed
        run: |
          # Branch-only build artifacts and deterministic gateway mirrors; this workflow never deploys Scout.
          if git diff --quiet -- \
            supabase/functions/scout-component-sandbox-mcp/view.generated.ts \
            supabase/functions/scout-connect/index.ts \
            supabase/functions/scout-mcp-contract/index.ts; then
            echo 'Branch build outputs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            supabase/functions/scout-component-sandbox-mcp/view.generated.ts \
            supabase/functions/scout-connect/index.ts \
            supabase/functions/scout-mcp-contract/index.ts
          git commit -m 'Build Warren portfolio sandbox v27'
          git push origin HEAD:scout/warren-portfolio-sandbox
