name: Scout Warren portfolio sandbox branch build

on:
  push:
    branches:
      - scout/warren-portfolio-sandbox
    paths:
      - 'supabase/functions/scout-component-sandbox-mcp/**'
      - '.github/workflows/scout-warren-portfolio-sandbox-branch-build.yml'

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout/warren-portfolio-sandbox
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/functions/scout-component-sandbox-mcp/package-lock.json
      - name: Install sandbox dependencies
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm ci
      - name: Build MCP Apps view bundle
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm run build
      - name: Run sandbox tests
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: npm test
      - name: Commit generated view when changed
        run: |
          # Branch-only build artifact; this workflow never deploys Scout.
          if git diff --quiet -- supabase/functions/scout-component-sandbox-mcp/view.generated.ts; then
            echo 'Generated view already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/scout-component-sandbox-mcp/view.generated.ts
          git commit -m 'Build Warren portfolio sandbox view'
          git push origin HEAD:scout/warren-portfolio-sandbox
