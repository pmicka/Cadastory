name: Farm Watch HLS field observations materialization

on:
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write

jobs:
  materialize:
    if: >-
      github.actor == 'pmicka' &&
      github.event.issue.user.login == 'pmicka' &&
      github.event.issue.title == '[ops] Materialize Farm Watch HLS field observations'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HLS materializer dependencies
        run: >-
          python -m pip install
          numpy==2.1.3
          rasterio==1.4.3
          requests==2.32.5
          pystac==1.14.1
          pystac-client==0.9.0
          planetary-computer==1.0.0

      - name: Compile HLS materializer
        run: python -m py_compile scripts/farm-watch-hls-field-observations.py

      - name: Materialize validation property
        env:
          TZ: America/Kentucky/Louisville
        run: |
          AS_OF_DATE="$(date +%F)"
          python scripts/farm-watch-hls-field-observations.py \
            --property validation-property-01 \
            --as-of-date "$AS_OF_DATE"
