name: Dealership narrow raster fix

on:
  push:
    branches:
      - fix/dealership-map-raster-diagnostics

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dealership-map-raster-diagnostics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply narrow-raster fix
        run: python .github/scripts/dealership_narrow_raster_patch.py
      - name: Build and test Scout sandbox
        run: |
          cd supabase/functions/scout-component-sandbox-mcp
          npm ci
          npm run build
          npm test
      - name: Commit verified fix
        run: |
          rm .github/workflows/dealership-narrow-raster-fix.yml
          rm .github/workflows/dealership-raster-diagnostic.yml
          rm .github/scripts/dealership_narrow_raster_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix narrow Don Franklin portfolio raster frame"
          git push origin HEAD:fix/dealership-map-raster-diagnostics
