name: Scout map v26 build

on:
  push:
    branches:
      - fix/scout-all-map-embedded-raster-v26

permissions:
  contents: write

jobs:
  patch-build-test:
    if: ${{ !contains(github.event.head_commit.message, '[scout-v26-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scout-all-map-embedded-raster-v26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply bounded embedded-raster transport patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('supabase/functions/scout-component-sandbox-mcp')

          def read(name):
              return (root / name).read_text()

          def write(name, text):
              (root / name).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # index.ts: resource v26 and one resource-embedded bounded tile union for all three exemplars.
          index = read('index.ts')
          index = replace_once(
              index,
              "import { buildScoutSwpppSiteRasterFrame } from './swppp_site_map_renderer.ts'\n",
              "import { buildScoutSwpppSiteRasterFrame } from './swppp_site_map_renderer.ts'\nimport { buildScoutSingleSiteRasterFrame } from './single_site_map_renderer.ts'\nimport { buildScoutWaterTankRasterFrame } from './water_tank_map_renderer.ts'\n",
              'index imports',
          )
          index = replace_once(index, "const RESOURCE_URI = 'ui://scout/component-sandbox/v25'", "const RESOURCE_URI = 'ui://scout/component-sandbox/v26'", 'resource uri')
          index = replace_once(
              index,
              "const COMPATIBILITY_RESOURCE_URIS = [\n  'ui://scout/component-sandbox/v24',",
              "const COMPATIBILITY_RESOURCE_URIS = [\n  'ui://scout/component-sandbox/v25',\n  'ui://scout/component-sandbox/v24',",
              'compatibility v25',
          )
          pattern = re.compile(r"async function loadEmbeddedSwpppTiles\(map: ScoutSandboxSwpppSiteMap\) \{.*?\n\}\n\nlet scoutViewHtmlPromise", re.S)
          replacement = """type EmbeddedRasterTile = { z: number; x: number; y: number; url: string }
const MAX_EMBEDDED_RASTER_TILES = 20

async function loadEmbeddedRasterTile(tile: EmbeddedRasterTile) {
  const response = await fetch(`${MAP_TILE_UPSTREAM}/${tile.z}/${tile.x}/${tile.y}.png`, {
    headers: { 'user-agent': 'Scout-by-Cadastory-Sandbox/1.0 (+https://github.com/pmicka/Cadastory)' },
  })
  if (!response.ok || !String(response.headers.get('content-type')).startsWith('image/png')) {
    throw new Error('Scout sandbox raster tile is unavailable')
  }
  const bytes = new Uint8Array(await response.arrayBuffer())
  let binary = ''
  for (const byte of bytes) binary += String.fromCharCode(byte)
  return { url: tile.url, data_url: `data:image/png;base64,${btoa(binary)}` }
}

async function loadEmbeddedSandboxTiles() {
  const tileUrlTemplate = `${SUPABASE_URL}/functions/v1/scout-component-sandbox-mcp/map-tile/{z}/{x}/{y}.png`
  const [premiumMap, waterTankMap, swpppMap] = await Promise.all([
    loadScoutSandboxSingleSiteMap(),
    loadScoutSandboxWaterTankMap(),
    loadScoutSandboxSwpppSiteMap(),
  ])
  const frames = [
    buildScoutSingleSiteRasterFrame(premiumMap, 456, 210, { tileUrlTemplate }),
    buildScoutWaterTankRasterFrame(waterTankMap, 456, 210, { tileUrlTemplate }),
    buildScoutSwpppSiteRasterFrame(swpppMap, 456, 210, { tileUrlTemplate }),
  ]
  const uniqueTiles = new Map<string, EmbeddedRasterTile>()
  for (const frame of frames) {
    for (const tile of frame.tiles) uniqueTiles.set(tile.url, tile)
  }
  if (uniqueTiles.size > MAX_EMBEDDED_RASTER_TILES) {
    throw new Error('Scout sandbox embedded raster exceeded the bounded tile budget')
  }
  return await Promise.all(Array.from(uniqueTiles.values(), loadEmbeddedRasterTile))
}

let scoutViewHtmlPromise"""
          index, count = pattern.subn(replacement, index, count=1)
          if count != 1:
              raise SystemExit(f'embedded loader: expected one block, found {count}')
          index = replace_once(
              index,
              "      const map = await loadScoutSandboxSwpppSiteMap()\n      const tiles = await loadEmbeddedSwpppTiles(map)\n",
              "      const tiles = await loadEmbeddedSandboxTiles()\n",
              'view html loader',
          )
          index = replace_once(
              index,
              "((compatibilityUri === 'ui://scout/component-sandbox/v22' || compatibilityUri === 'ui://scout/component-sandbox/v23' || compatibilityUri === 'ui://scout/component-sandbox/v24')",
              "((compatibilityUri === 'ui://scout/component-sandbox/v22' || compatibilityUri === 'ui://scout/component-sandbox/v23' || compatibilityUri === 'ui://scout/component-sandbox/v24' || compatibilityUri === 'ui://scout/component-sandbox/v25')",
              'compatibility embedded resource list',
          )
          index = replace_once(index, "version: '2.2.5'", "version: '2.2.6'", 'server version')
          write('index.ts', index)

          # view.ts: accept tightly bounded all-exemplar payload and pass it to every renderer.
          view = read('view.ts')
          view = replace_once(view, 'if (!Array.isArray(value) || value.length > 12) return undefined', 'if (!Array.isArray(value) || value.length > 20) return undefined', 'embedded tile bound')
          view = replace_once(
              view,
              'mapHandle = mountScoutWaterTankMap(mapContainer, mapData, mapOptions)',
              'mapHandle = mountScoutWaterTankMap(mapContainer, mapData, { ...mapOptions, embeddedTiles })',
              'water embedded tiles',
          )
          view = replace_once(
              view,
              'mapHandle = mountScoutSingleSiteMap(mapContainer, mapData, mapOptions)',
              'mapHandle = mountScoutSingleSiteMap(mapContainer, mapData, { ...mapOptions, embeddedTiles })',
              'premium embedded tiles',
          )
          view = replace_once(view, "version: '2.5.5'", "version: '2.6.0'", 'view version')
          write('view.ts', view)

          # Premium exterior renderer: prefer the same proven embedded PNG -> ImageBitmap -> canvas transport as SWPPP.
          single = read('single_site_map_renderer.ts')
          single = replace_once(
              single,
              "const DEFAULT_TIMEOUT_MS = 7000\n",
              "const DEFAULT_TIMEOUT_MS = 7000\nconst PNG_DATA_URL_PREFIX = 'data:image/png;base64,'\n\nasync function decodeEmbeddedRasterTile(dataUrl: string) {\n  if (!dataUrl.startsWith(PNG_DATA_URL_PREFIX)) throw new Error('Scout embedded raster tile is invalid')\n  const binary = atob(dataUrl.slice(PNG_DATA_URL_PREFIX.length))\n  const bytes = new Uint8Array(binary.length)\n  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index)\n  return await createImageBitmap(new Blob([bytes], { type: 'image/png' }))\n}\n",
              'single decode helper',
          )
          single = replace_once(
              single,
              "  timeoutMs?: number\n  onError?: (error: Error) => void\n",
              "  timeoutMs?: number\n  embeddedTiles?: Record<string, string>\n  onError?: (error: Error) => void\n",
              'single options',
          )
          old_single_loop = """    for (const tile of frame.tiles) {
      const image = document.createElement('img')
      image.alt = ''
      image.draggable = false
      image.decoding = 'async'
      image.loading = 'eager'
      image.referrerPolicy = 'origin'
      image.src = tile.url
      image.style.left = `${tile.left}px`
      image.style.top = `${tile.top}px`
      image.addEventListener('load', () => {
        if (destroyed || generation !== renderGeneration) return
        loadedTiles += 1
        settledTiles += 1
        if (loadedTiles === 1) finishReady()
      }, { once: true })
      image.addEventListener('error', () => {
        if (destroyed || generation !== renderGeneration) return
        settledTiles += 1
        if (settledTiles === frame.tiles.length && loadedTiles === 0) finishError()
      }, { once: true })
      container.appendChild(image)
    }
"""
          new_single_loop = """    const embeddedFrame = frame.tiles.length > 0 && frame.tiles.every((tile) => options.embeddedTiles?.[tile.url])
    if (embeddedFrame) {
      const canvas = document.createElement('canvas')
      canvas.width = frame.width
      canvas.height = frame.height
      canvas.style.position = 'absolute'
      canvas.style.inset = '0'
      canvas.style.width = `${frame.width}px`
      canvas.style.height = `${frame.height}px`
      container.appendChild(canvas)
      const context = canvas.getContext('2d')
      if (!context) {
        finishError()
        return
      }
      void Promise.allSettled(frame.tiles.map(async (tile) => {
        const bitmap = await decodeEmbeddedRasterTile(options.embeddedTiles![tile.url])
        if (!destroyed && generation === renderGeneration) {
          context.drawImage(bitmap, tile.left, tile.top, 256, 256)
          loadedTiles += 1
        }
        bitmap.close()
      })).then(() => {
        settledTiles = frame.tiles.length
        if (loadedTiles > 0) finishReady()
        else finishError()
      })
    } else {
      for (const tile of frame.tiles) {
        const image = document.createElement('img')
        image.alt = ''
        image.draggable = false
        image.decoding = 'async'
        image.loading = 'eager'
        image.referrerPolicy = 'origin'
        image.src = tile.url
        image.style.left = `${tile.left}px`
        image.style.top = `${tile.top}px`
        image.addEventListener('load', () => {
          if (destroyed || generation !== renderGeneration) return
          loadedTiles += 1
          settledTiles += 1
          if (loadedTiles === 1) finishReady()
        }, { once: true })
        image.addEventListener('error', () => {
          if (destroyed || generation !== renderGeneration) return
          settledTiles += 1
          if (settledTiles === frame.tiles.length && loadedTiles === 0) finishError()
        }, { once: true })
        container.appendChild(image)
      }
    }
"""
          single = replace_once(single, old_single_loop, new_single_loop, 'single render branch')
          write('single_site_map_renderer.ts', single)

          # Water-tank mount: same transport-only change, preserving point geometry and render model.
          water = read('water_tank_map_mount.ts')
          water = replace_once(
              water,
              "const DEFAULT_TIMEOUT_MS = 7000\n",
              "const DEFAULT_TIMEOUT_MS = 7000\nconst PNG_DATA_URL_PREFIX = 'data:image/png;base64,'\n\nasync function decodeEmbeddedRasterTile(dataUrl: string) {\n  if (!dataUrl.startsWith(PNG_DATA_URL_PREFIX)) throw new Error('Scout embedded raster tile is invalid')\n  const binary = atob(dataUrl.slice(PNG_DATA_URL_PREFIX.length))\n  const bytes = new Uint8Array(binary.length)\n  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index)\n  return await createImageBitmap(new Blob([bytes], { type: 'image/png' }))\n}\n",
              'water decode helper',
          )
          water = replace_once(
              water,
              "  timeoutMs?: number\n  onError?: (error: Error) => void\n",
              "  timeoutMs?: number\n  embeddedTiles?: Record<string, string>\n  onError?: (error: Error) => void\n",
              'water options',
          )
          old_water_loop = """    for (const tile of frame.tiles) {
      const image = document.createElement('img')
      image.alt = ''
      image.draggable = false
      image.decoding = 'async'
      image.loading = 'eager'
      image.referrerPolicy = 'origin'
      image.src = tile.url
      image.style.left = `${tile.left}px`
      image.style.top = `${tile.top}px`
      image.addEventListener('load', () => {
        if (destroyed || generation !== renderGeneration) return
        loadedTiles += 1
        settledTiles += 1
        if (loadedTiles === 1) finishReady()
      }, { once: true })
      image.addEventListener('error', () => {
        if (destroyed || generation !== renderGeneration) return
        settledTiles += 1
        if (settledTiles === frame.tiles.length && loadedTiles === 0) finishError()
      }, { once: true })
      container.appendChild(image)
    }
"""
          new_water_loop = new_single_loop
          water = replace_once(water, old_water_loop, new_water_loop, 'water render branch')
          write('water_tank_map_mount.ts', water)

          # Tests: lock the v26 transport extension without weakening existing fallback assertions.
          test = read('single_site_map_renderer_test.mjs')
          test = replace_once(test, "assert.ok(server.includes(\"const RESOURCE_URI = 'ui://scout/component-sandbox/v25'\"))", "assert.ok(server.includes(\"const RESOURCE_URI = 'ui://scout/component-sandbox/v26'\"))", 'single test uri')
          anchor = "assert.ok(rendererSource.includes(\"document.createElement('img')\"))\n"
          test = replace_once(
              test,
              anchor,
              anchor + "assert.ok(rendererSource.includes(\"document.createElement('canvas')\"))\nassert.ok(rendererSource.includes('createImageBitmap'))\nassert.ok(rendererSource.includes('embeddedTiles'))\n",
              'single test canvas asserts',
          )
          anchor = "assert.ok(server.includes('csp: { resourceDomains: [MAP_TILE_ORIGIN] }'))\n"
          test = replace_once(
              test,
              anchor,
              anchor + "assert.ok(server.includes('loadEmbeddedSandboxTiles'))\nassert.ok(server.includes('MAX_EMBEDDED_RASTER_TILES = 20'))\nassert.ok(server.includes('buildScoutSingleSiteRasterFrame(premiumMap, 456, 210'))\nassert.ok(server.includes('buildScoutWaterTankRasterFrame(waterTankMap, 456, 210'))\n",
              'single test server transport asserts',
          )
          test = replace_once(
              test,
              "assert.ok(view.includes('mountScoutSingleSiteMap'))\n",
              "assert.ok(view.includes('mountScoutSingleSiteMap'))\nassert.ok(view.includes('mountScoutSingleSiteMap(mapContainer, mapData, { ...mapOptions, embeddedTiles })'))\n",
              'single test view embedded',
          )
          test = replace_once(
              test,
              "assert.ok(mapContract.includes('mobile ChatGPT host / PNC premium exterior: **verified working**'))\nassert.ok(mapContract.includes('desktop ChatGPT host / PNC premium exterior: still requires explicit visual verification'))\n",
              "assert.ok(mapContract.includes('Cross-opportunity embedded raster transport — owner evidence 2026-09-13'))\nassert.ok(mapContract.includes('runtime image-subrequest path is no longer treated as currently verified'))\n",
              'single test host state',
          )
          write('single_site_map_renderer_test.mjs', test)

          water_test = read('water_tank_map_renderer_test.mjs')
          water_test = replace_once(
              water_test,
              "assert.ok(mountSource.includes('buildScoutWaterTankRasterFrame'))\n",
              "assert.ok(mountSource.includes('buildScoutWaterTankRasterFrame'))\nassert.ok(mountSource.includes(\"document.createElement('canvas')\"))\nassert.ok(mountSource.includes('createImageBitmap'))\nassert.ok(mountSource.includes('embeddedTiles'))\n",
              'water test canvas asserts',
          )
          water_test = replace_once(
              water_test,
              "assert.ok(view.includes('mountScoutWaterTankMap'))\n",
              "assert.ok(view.includes('mountScoutWaterTankMap'))\nassert.ok(view.includes('mountScoutWaterTankMap(mapContainer, mapData, { ...mapOptions, embeddedTiles })'))\n",
              'water test view embedded',
          )
          water_test = replace_once(
              water_test,
              "assert.ok(generated.includes('Rehab signal'))\n",
              "assert.ok(generated.includes('Rehab signal'))\nassert.ok(generated.includes('createImageBitmap'))\n",
              'water generated canvas assert',
          )
          write('water_tank_map_renderer_test.mjs', water_test)

          contract = read('MAP_CONTRACT.md')
          note = """## Cross-opportunity embedded raster transport — owner evidence 2026-09-13

The owner verified in the native Android ChatGPT host that the v25 SWPPP card now renders its map, while a newly rendered SOUTH PRESSURE ZONE TANK card returns the correct opportunity content but displays `Site map unavailable`; the owner also reports the previously functional map types are affected. This is current host evidence, superseding the assumption that the runtime image-subrequest path remains reliable for the earlier map types.

Resource v26 extends the already-proven SWPPP **transport only** to all three bounded exemplars. The server computes the canonical 456×210 raster frames for PNC Tower, SOUTH PRESSURE ZONE TANK, and HAM–Brent Spence, deduplicates their bounded tile URLs, and embeds at most 20 PNG entries in the View resource. The current three canonical frames require 18 unique tiles. Because the approved card is at most 456px wide and the media viewport remains 210px high, narrower host frames consume subsets of those canonical tile sets at the existing contract zooms.

The PNC and water-tank renderers now prefer the same local PNG → `Blob` → `ImageBitmap` → ordinary 2D canvas path that is host-verified for SWPPP. Their existing runtime `<img>` tile path remains only as a fallback. No opportunity data, geometry, zoom semantics, provider, CSP origin, card layout, service/profile gate, authentication, or evidence guardrail changes in this batch. The runtime image-subrequest path is no longer treated as currently verified merely because it worked on 2026-09-12.

Host verification remains required for v26 PNC and water-tank maps after deployment; this transport change is not marked fixed until the owner verifies those cards in the real host.

"""
          if '## Cross-opportunity embedded raster transport — owner evidence 2026-09-13' in contract:
              raise SystemExit('MAP_CONTRACT v26 note already exists')
          contract = note + contract
          write('MAP_CONTRACT.md', contract)
          PY
      - name: Install, build and test sandbox View
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: |
          npm ci
          npm run build
          npm test
      - name: Verify generated View changed with source
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain supabase/functions/scout-component-sandbox-mcp/view.generated.ts)"
      - name: Commit generated v26 patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/scout-map-v26-build.yml
          git add supabase/functions/scout-component-sandbox-mcp
          git commit -m "Use embedded raster transport for all sandbox maps [scout-v26-built]"
          git push origin HEAD:fix/scout-all-map-embedded-raster-v26
