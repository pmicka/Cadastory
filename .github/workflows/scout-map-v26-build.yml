name: Scout map v26 build

on:
  push:
    branches:
      - fix/scout-all-map-embedded-raster-v26

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scout-all-map-embedded-raster-v26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply bounded embedded-raster transport patch
        run: python .github/scout_map_v26_patch.py
      - name: Install, build and test sandbox View
        working-directory: supabase/functions/scout-component-sandbox-mcp
        run: |
          npm ci
          npm run build
          npm test
      - name: Validate diff
        run: |
          git diff --check
          test -n "$(git status --porcelain supabase/functions/scout-component-sandbox-mcp/view.generated.ts)"
      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/scout-map-v26-build.yml .github/scout_map_v26_patch.py
          git add supabase/functions/scout-component-sandbox-mcp
          git commit -m "Use embedded raster transport for all sandbox maps"
          git push origin HEAD:fix/scout-all-map-embedded-raster-v26
