name: Farm Watch neutral primitives CI

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/farm-watch-neutral-primitives.ts'
      - 'supabase/functions/_shared/farm-watch-neutral-primitives-contract.ts'
      - 'supabase/functions/_shared/farm-watch-neutral-primitives.test.ts'
      - 'supabase/functions/_shared/farm-watch-presentation-policy.ts'
      - 'supabase/functions/_shared/farm-watch-presentation-policy.test.ts'
      - 'supabase/functions/farm-watch-materialization/index.ts'
      - 'supabase/migrations/*farm_watch_resource_edge_service_wrapper*.sql'
      - '.github/workflows/farm-watch-neutral-primitives-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neutral-primitives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check neutral primitive module
        run: deno check supabase/functions/_shared/farm-watch-neutral-primitives.ts
      - name: Check materialization edge
        run: deno check supabase/functions/farm-watch-materialization/index.ts
      - name: Run neutral primitive tests
        run: deno test supabase/functions/_shared/farm-watch-neutral-primitives.test.ts
      - name: Run presentation policy tests
        run: deno test supabase/functions/_shared/farm-watch-presentation-policy.test.ts
