name: Dealership host diagnostics v32

on:
  push:
    branches:
      - diag/dealership-map-host-v32

permissions:
  contents: write

jobs:
  patch-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/dealership-map-host-v32
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply diagnostic instrumentation
        run: python .github/scripts/dealership_host_diagnostics_v32.py
      - name: Build and test Scout sandbox
        run: |
          cd supabase/functions/scout-component-sandbox-mcp
          npm ci
          npm run build
          npm test
      - name: Commit verified diagnostics and remove temporary workflow
        run: |
          rm .github/scripts/dealership_host_diagnostics_v32.py
          rm .github/workflows/dealership-host-diagnostics-v32.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Instrument dealership portfolio host map diagnostics v32'
          git push origin HEAD:diag/dealership-map-host-v32
