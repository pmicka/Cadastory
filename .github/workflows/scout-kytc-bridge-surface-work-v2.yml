name: Scout KYTC bridge surface-work v2

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  kytc-bridge-surface-work:
    if: ${{ github.event.issue.title == '[ops] Run Scout KYTC bridge surface-work v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install loader dependencies
        run: python -m pip install --upgrade requests beautifulsoup4 pypdf
      - name: Load authoritative KYTC bridge surface-work evidence v2
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_KYTC_BRIDGE_MAX_DOCUMENTS: "40"
          SCOUT_KYTC_BRIDGE_LOOKBACK_YEARS: "5"
          SCOUT_KYTC_BRIDGE_BATCH_SIZE: "100"
        run: python scripts/scout_kytc_bridge_surface_work_loader_v2.py
