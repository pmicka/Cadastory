name: Scout bulk building enrichment

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: scout-bulk-building-enrichment
  cancel-in-progress: false

jobs:
  overture:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.issue.title == '[ops] Run Scout bulk building enrichment' }}
    name: Overture building attributes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install DuckDB CLI and Python dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade requests
          asset_url="$(python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              'https://api.github.com/repos/duckdb/duckdb/releases/latest',
              headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}", 'Accept': 'application/vnd.github+json'}
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              release = json.load(r)
          for asset in release.get('assets', []):
              if asset.get('name') == 'duckdb_cli-linux-amd64.zip':
                  print(asset['browser_download_url'])
                  break
          else:
              raise SystemExit('DuckDB linux-amd64 CLI asset not found')
          PY
          )"
          curl -fsSL "$asset_url" -o /tmp/duckdb.zip
          unzip -q /tmp/duckdb.zip -d /tmp/duckdb-cli
          sudo install -m 0755 /tmp/duckdb-cli/duckdb /usr/local/bin/duckdb
          duckdb --version

      - name: Load Overture building attributes
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_OVERTURE_RELEASE: "2026-08-19.0"
          SCOUT_OVERTURE_BATCH_SIZE: "100"
        run: python scripts/scout_overture_building_attribute_loader.py

  osm:
    name: OSM building attributes
    needs: overture
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.issue.title == '[ops] Run Scout bulk building enrichment') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          python -m pip install --upgrade requests

      - name: Load explicit OSM building attributes
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_OSM_BUILDING_BATCH_SIZE: "100"
        run: python scripts/scout_osm_building_attribute_loader.py

  nrhp:
    name: National Register historic resources
    needs: osm
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.issue.title == '[ops] Run Scout bulk building enrichment') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install --upgrade requests

      - name: Load NRHP points and polygons
        env:
          SUPABASE_URL: ${{ secrets.SCOUT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SCOUT_SUPABASE_SERVICE_ROLE_KEY }}
          SCOUT_NRHP_STATES: "KY,IN,OH"
          SCOUT_NRHP_BATCH_SIZE: "100"
        run: python scripts/scout_nrhp_historic_resource_loader.py
