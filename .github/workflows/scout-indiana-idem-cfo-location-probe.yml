name: Scout Indiana IDEM CFO location probe

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: scout-indiana-idem-cfo-location-probe
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ github.event_name != 'issues' || github.event.issue.title == '[ops] Probe Scout Indiana IDEM CFO locations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install probe dependencies
        run: python -m pip install --upgrade requests xlrd
      - name: Inspect current issued CFO/CAFO workbook transiently
        run: python scripts/scout_indiana_idem_cfo_location_probe.py
