name: Farm Watch deer relationship registry CI

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/farm-watch-deer-relationship-registry.ts'
      - 'supabase/functions/_shared/farm-watch-deer-relationship-registry.test.ts'
      - 'supabase/functions/_shared/farm-watch-diel-biological-state.ts'
      - 'supabase/functions/_shared/farm-watch-diel-biological-state.test.ts'
      - 'docs/FARM_WATCH_DEER_RELATIONSHIP_REGISTRY_V1.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_EVIDENCE_LEDGER.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_IMPLEMENTATION_PLAN.md'
      - '.github/workflows/farm-watch-deer-relationship-registry-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deer-relationship-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check relationship registry
        run: deno check supabase/functions/_shared/farm-watch-deer-relationship-registry.ts
      - name: Check Batch 3 registry consumer
        run: deno check supabase/functions/_shared/farm-watch-diel-biological-state.ts
      - name: Test relationship registry and ledger coverage
        run: deno test --allow-read supabase/functions/_shared/farm-watch-deer-relationship-registry.test.ts
      - name: Regression test Batch 3 biological state
        run: deno test supabase/functions/_shared/farm-watch-diel-biological-state.test.ts
