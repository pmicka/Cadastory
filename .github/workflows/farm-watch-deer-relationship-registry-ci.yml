name: Farm Watch deer relationship registry CI

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/farm-watch-deer-relationship-registry.ts'
      - 'supabase/functions/_shared/farm-watch-deer-relationship-registry.test.ts'
      - 'supabase/functions/_shared/farm-watch-deer-interaction-registry.ts'
      - 'supabase/functions/_shared/farm-watch-deer-interaction-evaluator.test.ts'
      - 'supabase/functions/_shared/farm-watch-deer-measurement-resolution.ts'
      - 'supabase/functions/_shared/farm-watch-deer-measurement-resolution.test.ts'
      - 'supabase/functions/_shared/farm-watch-deer-science-evaluator.ts'
      - 'supabase/functions/_shared/farm-watch-deer-science-evaluator.test.ts'
      - 'scripts/check-farm-watch-ui-evidence-stack.ts'
      - 'supabase/functions/_shared/farm-watch-diel-biological-state.ts'
      - 'supabase/functions/_shared/farm-watch-diel-biological-state.test.ts'
      - 'docs/FARM_WATCH_DEER_RELATIONSHIP_REGISTRY_V1.md'
      - 'docs/FARM_WATCH_DEER_RELATIONSHIP_REGISTRY_V2.md'
      - 'docs/FARM_WATCH_DEER_RELATIONSHIP_REGISTRY_V3.md'
      - 'docs/FARM_WATCH_DEER_MEASUREMENT_RESOLUTION_V1.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_CONTEXT_V1.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_CONTEXT_V2.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_CONTEXT_V3.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_CONTEXT_V4.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_CONTEXT_V5.md'
      - 'docs/FARM_WATCH_DEER_STATE_FRAMEWORK_V1.md'
      - 'docs/FARM_WATCH_DEER_INTERACTION_REGISTRY_V1.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_EVIDENCE_LEDGER.md'
      - 'docs/FARM_WATCH_DEER_SCIENCE_IMPLEMENTATION_PLAN.md'
      - '.github/workflows/farm-watch-deer-relationship-registry-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deer-relationship-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check relationship registry
        run: deno check supabase/functions/_shared/farm-watch-deer-relationship-registry.ts
      - name: Check deer interaction registry
        run: deno check supabase/functions/_shared/farm-watch-deer-interaction-registry.ts
      - name: Check measurement resolution decisions
        run: deno check supabase/functions/_shared/farm-watch-deer-measurement-resolution.ts
      - name: Check registry-driven deer evaluator
        run: deno check supabase/functions/_shared/farm-watch-deer-science-evaluator.ts
      - name: Check Batch 3 registry consumer
        run: deno check supabase/functions/_shared/farm-watch-diel-biological-state.ts
      - name: Test relationship registry and ledger coverage
        run: deno test --allow-read supabase/functions/_shared/farm-watch-deer-relationship-registry.test.ts
      - name: Test measurement resolution coverage
        run: deno test supabase/functions/_shared/farm-watch-deer-measurement-resolution.test.ts
      - name: Test registry-driven deer evaluator
        run: deno test supabase/functions/_shared/farm-watch-deer-science-evaluator.test.ts
      - name: Test deer interaction evaluator
        run: deno test supabase/functions/_shared/farm-watch-deer-interaction-evaluator.test.ts
      - name: Check Farm Watch deer state and evidence-stack invariants
        run: deno run --allow-read scripts/check-farm-watch-ui-evidence-stack.ts
      - name: Regression test Batch 3 biological state
        run: deno test supabase/functions/_shared/farm-watch-diel-biological-state.test.ts
