name: Warren morphology marker batch

on:
  push:
    branches:
      - scout/warren-flat-morphology-markers

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scout/warren-flat-morphology-markers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply source patch
        run: |
          python .github/scripts/warren_morphology_markers.py
          find supabase/functions/scout-component-sandbox-mcp -name '*test.mjs' -type f -exec sed -i "s#const RESOURCE_URI = 'ui://scout/component-sandbox/v27'#const RESOURCE_URI = 'ui://scout/component-sandbox/v28'#g; s#const SANDBOX_RESOURCE_URI = 'ui://scout/component-sandbox/v27'#const SANDBOX_RESOURCE_URI = 'ui://scout/component-sandbox/v28'#g" {} +
      - name: Build and test Scout sandbox
        run: |
          cd supabase/functions/scout-component-sandbox-mcp
          npm ci
          npm run build
          npm test
      - name: Commit verified changes
        run: |
          rm .github/workflows/warren-morphology-markers-temp.yml
          rm .github/scripts/warren_morphology_markers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render flat morphology-coded Warren markers"
          git push origin HEAD:scout/warren-flat-morphology-markers
